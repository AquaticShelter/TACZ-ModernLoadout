plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    // Parchment/librarian removed on purpose: its floating '1.+' resolution broke the mapping
    // channel registration (the "Could not find net.minecraft:client:1.20.1" failure — raw
    // unmapped coordinates leaking into resolution). Official mojmap is built into ForgeGradle,
    // needs no external plugin, and is source-identical for this codebase (parchment only adds
    // parameter names).
}

group = mod_group_id
version = mod_version

base {
    // Jar reads mwloadout-R1-stable-1.20.1-1.0.0.jar — release_label (gradle.properties) is filename-only,
    // mods.toml/Forge still see the plain semver mod_version, so version-range checks are unaffected.
    archivesName = "${mod_id}-${release_label}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {}
    }
}

repositories {
    // Mixin annotations only (the AMMO TYPE slot, see MWSlots). Forge ships the runtime; this is just for compiling the @Mixin classes.
    maven {
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'org.spongepowered' }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://maven.isxander.dev/releases'
        content { includeGroup 'dev.isxander' }
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // TACZ 1.1.8 binary, compileOnly and deliberately WITHOUT fg.deobf. fg.deobf spawns the
    // internal _compileJava_1 configuration whose remap step was the exact point of the
    // "Could not find net.minecraft:client:1.20.1" failure. It's also unnecessary here:
    // this mod only touches TACZ's OWN API (com.tacz.* class and method names, which ship
    // unobfuscated on CurseForge) with vanilla types in signatures (vanilla CLASS names are
    // unobfuscated in Forge 1.17+ production jars) — javac resolves everything against the
    // raw jar. Deobf would only matter for runClient dev runs, which this project doesn't use;
    // the built jar runs against real TACZ in the actual game either way.
    compileOnly 'org.spongepowered:mixin:0.8.5'

    compileOnly 'curse.maven:timeless-and-classics-zero-1028108:8055552'

    // Cloth Config API 11.1.136 (Forge 1.20.1) - OPTIONAL in-game config screen (Mods > MW Loadout > Config). compileOnly and WITHOUT fg.deobf for
    // the same reason as TACZ above; the integration class (client/ClothConfigCompat) is only ever loaded when the mod is present, and mods.toml
    // lists it as mandatory=false, so players without Cloth Config just keep the in-game SETTINGS screen.
    compileOnly 'curse.maven:cloth-config-348521:5729105'

    // YACL (Yet Another Config Lib) 3.6.5 for Forge 1.20.1 - OPTIONAL, the detailed config screen (every toast / HUD position, colours, scale). Same
    // compileOnly + no fg.deobf reasoning as above; client/YaclConfigCompat is only loaded when the mod is present and mods.toml marks it optional.
    compileOnly 'dev.isxander:yet-another-config-lib:3.6.5+1.20.1-forge'

    // LRTactical items (melee/consumable/throwable) are built via item-id + NBT strings only
    // (ThrowableId / MeleeWeaponId / ConsumableId) — no compile-time dependency needed.
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                // Forge 1.20.1 registers a mod's mixin config from this manifest entry (the mods.toml [[mixins]] block alone was not picked up:
                // the first AMMO TYPE test logged "mixin config registered=false")
                'MixinConfigs'          : 'mwloadout.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
